server {
    listen 8443 ssl;
    server_name api.orivasmarket.uz;

    ssl_certificate /etc/letsencrypt/live/api.orivasmarket.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.orivasmarket.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;
    server_tokens off;

    # This listener serves only the attendance Mini App and its private API.
    # The bot API remains bound to loopback; the fixed header is overwritten here.
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Cue-Origin "https://api.orivasmarket.uz:8443";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
