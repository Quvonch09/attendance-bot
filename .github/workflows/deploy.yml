name: Test and deploy attendance bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cue-attendance-bot-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out private repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lightweight test dependencies
        run: python -m pip install "aiogram>=3.13,<4" "aiohttp>=3.9,<4" "python-dotenv>=1.0,<2"

      - name: Check Python syntax and security regressions
        run: |
          python -m py_compile bot.py webapp_api.py
          python -m unittest discover -s tests -v

      - name: Check Web App JavaScript syntax
        run: node --check webapp/app.js

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEPLOY_HOST: 169.58.215.170
      DEPLOY_USER: cue-attendance-bot
      DEPLOY_DIR: /opt/cue-attendance-bot
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Check out private repository
        uses: actions/checkout@v4

      - name: Check whether deployment key is configured
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_SSH_KEY" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped until the repository secret DEPLOY_SSH_KEY is configured."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure pinned SSH access
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s deploy/known_hosts
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          install -m 600 deploy/known_hosts "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null

      - name: Upload release and deploy
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          release_dir="${DEPLOY_DIR}/releases/${GITHUB_SHA}"
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "mkdir -p '${release_dir}/deploy'"
          scp -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            bot.py webapp_api.py requirements.txt README.md "$target:${release_dir}/"
          scp -r -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            webapp "$target:${release_dir}/"
          scp -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deploy/deploy.sh "$target:${release_dir}/deploy/"
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$target" "bash '${release_dir}/deploy/deploy.sh' '${GITHUB_SHA}'" </dev/null
