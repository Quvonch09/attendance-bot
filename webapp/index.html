<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f1724">
  <title>Davomat</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="/face-detection/v0.4.1646425229/face_detection.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="app">
    <header class="bar">
      <div class="title">
        <p id="greeting" class="greeting">Xush kelibsiz</p>
        <h1 id="action-title">Davomat</h1>
      </div>
      <ol class="steps" aria-label="Qadamlar">
        <li class="step" id="step-location">Joy</li>
        <li class="step" id="step-camera">Kamera</li>
        <li class="step" id="step-motion">Yuz</li>
      </ol>
    </header>

    <section class="video-wrap" id="video-wrap">
      <video id="video" autoplay muted playsinline webkit-playsinline></video>
      <div class="camera-placeholder" id="camera-placeholder"><div class="camera-glyph">◉</div><span>Kamera ochilmoqda…</span></div>
      <div class="face-guide" aria-hidden="true"></div>
      <div class="overlay">
        <strong id="instruction">Yuzingizni ramkaga joylang</strong>
        <div class="meta"><span id="capture-status">Yuz kutilmoqda</span><span id="capture-count">0 / 5</span></div>
        <div class="progress-track"><div id="progress" class="progress-fill"></div></div>
      </div>
    </section>

    <div id="notice" class="notice" role="status" aria-live="polite">Telegram chatdagi lokatsiya tekshirilmoqda…</div>

    <div class="actions">
      <button id="start-button" class="button primary">Boshlash</button>
      <button id="capture-button" class="button primary" hidden>Kadrlarni olish</button>
      <button id="retry-button" class="button secondary" hidden>Qayta urinish</button>
      <button id="stop-button" class="button text-button" hidden>To‘xtatish</button>
    </div>

    <!-- Internal state used by app.js; not shown, so the screen never needs scrolling. -->
    <div class="hidden-state" hidden>
      <label for="action-select">Davomat amali</label>
      <select id="action-select"><option value="checkin">Ishga kelish</option><option value="lunch_out">Tushlikka chiqish</option><option value="lunch_in">Tushlikdan qaytish</option><option value="checkout">Ishdan chiqish</option></select>
      <p id="location-status">Telegram chatdagi lokatsiya serverda tekshiriladi</p>
      <p id="camera-status"></p>
      <p id="motion-status"></p>
    </div>
  </main>
</body>
</html>
